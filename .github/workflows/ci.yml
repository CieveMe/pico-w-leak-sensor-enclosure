name: CAD and viewer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run geometry, export, variant, and negative-control tests
        run: python -m pytest -q
      - name: Rebuild baseline and version-matched viewer assets
        run: python scripts/prepare_viewer.py
      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
          npm run build
